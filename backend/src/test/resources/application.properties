
spring.datasource.url=jdbc:h2:mem:reachonline-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.security.enabled=false
app.clerk.issuer-uri=
app.cors.allowed-origins=http://localhost:3000

# Satisfy the LangChain4j bean condition without exposing a real credential;
# governance tests never invoke the AI endpoint.
langchain4j.open-ai.chat-model.api-key=test-only-placeholder
