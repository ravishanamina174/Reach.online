
spring.application.name=reach-online-backend

# Server
server.port=${PORT:8080}

# Local environment variables
spring.config.import=optional:file:.env[.properties]

# Neon PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Clerk JWT issuer. Set this in deployed environments, for example:
# https://your-instance.clerk.accounts.dev
app.clerk.issuer-uri=${CLERK_ISSUER_URI:}
app.security.enabled=${APP_SECURITY_ENABLED:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Flyway owns schema creation and changes
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
