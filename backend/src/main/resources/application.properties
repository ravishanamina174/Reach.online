
spring.application.name=reach-online-backend

# Server
server.port=${PORT:8080}

# Local environment variables
spring.config.import=optional:file:.env[.properties]

# Neon PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Clerk JWT issuer. Set this in deployed environments, for example:
# https://your-instance.clerk.accounts.dev
app.clerk.issuer-uri=${CLERK_ISSUER_URI:}
app.security.enabled=${APP_SECURITY_ENABLED:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Flyway owns schema creation and changes
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Reach AI - LangChain4j
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
langchain4j.open-ai.chat-model.temperature=0.2
langchain4j.open-ai.chat-model.max-tokens=${APP_AI_MAX_OUTPUT_TOKENS:800}
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

# Reach AI protection. Trusted proxies are comma-separated IPs or CIDR ranges.
app.ai.daily-user-request-limit=${APP_AI_DAILY_USER_REQUEST_LIMIT:10}
app.ai.global-request-limit=${APP_AI_GLOBAL_REQUEST_LIMIT:50}
app.ai.global-token-limit=${APP_AI_GLOBAL_TOKEN_LIMIT:50000}
app.ai.max-output-tokens=${APP_AI_MAX_OUTPUT_TOKENS:800}
app.ai.ip-requests-per-minute=${APP_AI_IP_REQUESTS_PER_MINUTE:5}
app.ai.max-active-generations-per-user=${APP_AI_MAX_ACTIVE_GENERATIONS_PER_USER:1}
app.ai.max-active-generations=${APP_AI_MAX_ACTIVE_GENERATIONS:5}
app.ai.max-input-tokens=${APP_AI_MAX_INPUT_TOKENS:4000}
app.ai.request-structure-overhead-tokens=${APP_AI_REQUEST_STRUCTURE_OVERHEAD_TOKENS:256}
app.ai.reservation-timeout-seconds=${APP_AI_RESERVATION_TIMEOUT_SECONDS:300}
app.ai.trusted-proxies=${APP_AI_TRUSTED_PROXIES:}
